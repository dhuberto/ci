# ============================================================
# Teste Workflow Reutilizavel
# ============================================================
# Workflow reutilizável contém a lógica de testes.
# É chamado pelo ci.yml e NÃO é executado diretamente.
# ============================================================

name: Teste Workflow Reutilizavel

# ============================================================
# on: DEFINE como este workflow pode ser chamado
# ============================================================
# workflow_call: Permite que outro workflow o chame via "uses:"
# inputs: Parâmetros que quem chama pode passar
# ============================================================

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '["3.10", "3.11"]'

# ============================================================
# permissions: O QUE este workflow pode fazer
# ============================================================
# contents: read -> Pode ler o código (necessário para o checkout)
# ============================================================

permissions:
  contents: read

# ============================================================
# jobs: TAREFAS que serão executadas
# ============================================================

jobs:
  # ==========================================================
  # JOB: test
  # ==========================================================
  # Executa testes em múltiplas versões do Python (matrix).
  # Cada versão roda em paralelo.
  # ==========================================================

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # ========================================================
    # strategy: DEFINE a matrix de versões
    # ========================================================
    # matrix: Cria uma execução para cada item da lista
    # fail-fast: false -> Se uma versão falhar, as outras continuam
    # ========================================================

    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-version) }}
      fail-fast: false

    # ========================================================
    # steps: PASSOS executados em sequência
    # ========================================================

    steps:
      # ------------------------------------------------------
      # STEP 1: Baixar o código
      # ------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # STEP 2: Instalar a versão do Python
      # ------------------------------------------------------
      # cache: pip -> Ativa o cache de dependências (mais rápido)
      # cache-dependency-path: Arquivo usado para gerar a chave do cache
      # ------------------------------------------------------
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # ------------------------------------------------------
      # STEP 3: Instalar dependências
      # ------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ------------------------------------------------------
      # STEP 4: Verificar vulnerabilidades (pip-audit)
      # ------------------------------------------------------
      # Se encontrar um CVE, o comando falha e bloqueia o merge.
      # Este é o GATE de segurança do pipeline.
      # ------------------------------------------------------
      - name: Run pip-audit (security gate)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # ------------------------------------------------------
      # STEP 5: Executar testes unitários (pytest)
      # ------------------------------------------------------
      - name: Run tests with pytest
        run: pytest test_app.py -v
