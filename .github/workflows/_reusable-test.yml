name: Reusable test

# Gatilho: chamado por outro workflow via "uses:"
on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test against
        required: false
        type: string
        default: '["3.10", "3.11", "3.12"]'

# Jobs: define os jobs do workflow reutilizavel
jobs:
  # Job de testes: roda em matrix de versoes do Python
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Estrategia: matrix de versoes com fail-fast desligado
    strategy:
      fail-fast: false # Se uma versao falhar, as outras continuam
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    # Steps: sequencia de execucao do job
    steps:
      # Baixa o codigo do repositorio (pinado por SHA por seguranca)
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Instala a versao do Python com cache de dependencias (pinado por SHA)
      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Instala as dependencias de producao e desenvolvimento
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Executa os testes unitarios
      - name: Run pytest
        run: pytest -q

         # Gate 3: CVEs no filesystem (código + libs).
      # exit-code 1 é o que transforma o scan em gate; sem isso ele só informa.
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: MEDIUM,HIGH,CRITICAL

      # Audita as dependencias em busca de vulnerabilidades conhecidas
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
