name: Reusable test

# Gatilho: chamado por outro workflow via "uses:"
on:
  workflow_call:
    inputs:
      python-versions:
        description: JSON array of Python versions to test against
        required: false
        type: string
        default: '["3.10", "3.11", "3.12"]'

# Variaveis de ambiente do workflow
env:
 IMAGE_NAME: app-k8s-todolist

jobs:
  # Job de testes: roda em matrix de versoes do Python
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Se uma versao falhar, as outras continuam
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      # Baixa o codigo do repositorio
      - name: Checkout
        # Dica de seguranca da aula: substituir @v4 pelo hash SHA do commit em producao
        uses: actions/checkout@v4

      # Instala a versao do Python com cache de dependencias
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Instala as dependencias de desenvolvimento
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      # Constroi a imagem Docker com a tag do commit
      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      # Scan de vulnerabilidades da imagem com Trivy (desativado)
      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
      #     format: table
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: os,library
      #     severity: MEDIUM,HIGH,CRITICAL
      #     skip-setup-trivy: false

      # Executa os testes unitarios
      - name: Run pytest
        run: pytest -q

      # Audita as dependencias em busca de vulnerabilidades conhecidas
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
