# ============================================================================
# TEST WORKFLOW
# ============================================================================


name: Test Workflow

# ============================================================================
# BLOCO on: Define como este workflow pode ser chamado
# ============================================================================


on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
        default: '["3.10", "3.11"]'

# ============================================================================
# BLOCO permissions: Permissões mínimas necessárias
# ============================================================================

permissions:
  contents: read
  checks: write

# ============================================================================
# BLOCO jobs: Define as tarefas que serão executadas
# ============================================================================

jobs:

  # ==========================================================================
  # JOB: test
  # ==========================================================================
  

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # ========================================================================
    # BLOCO strategy: Define a estratégia de execução (matrix)
    # ========================================================================
    

    strategy:
      matrix:
        python-version: ${{ fromJson(inputs.python-version) }}
      fail-fast: false

    # ========================================================================
    # BLOCO steps: Lista de passos executados em sequência
    # ========================================================================
   

    steps:

      # ----------------------------------------------------------------------
      # STEP 1: Checkout code
      # ----------------------------------------------------------------------
    

      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # STEP 2: Setup Python
      # ----------------------------------------------------------------------
    
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # ----------------------------------------------------------------------
      # STEP 3: Install dependencies
      # ----------------------------------------------------------------------
      

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ----------------------------------------------------------------------
      # STEP 4: Run pip-audit (security gate)
      # ----------------------------------------------------------------------
      
      - name: Run pip-audit (security gate)
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      # ----------------------------------------------------------------------
      # STEP 5: Run tests with pytest
      # ----------------------------------------------------------------------
      

      - name: Run tests with pytest
        run: pytest test_app.py -v

# ============================================================================
# FIM DO WORKFLOW REUTILIZÁVEL
# ============================================================================
