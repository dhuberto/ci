# ============================================================
# CI PIPELINE - GitHub Actions
# ============================================================
# Pipeline principal de Integração Contínua.
# Executa testes e verifica segurança em todo PR/push na main.
# ============================================================

name: CI Pipeline

# ============================================================
# on: QUANDO este pipeline será executado
# ============================================================
# pull_request: Ao abrir/atualizar um PR para a branch main
# push: Ao fazer um push diretamente na branch main
# workflow_dispatch: Permite execução manual pela aba Actions
# ============================================================

on:
  pull_request:
    branches: [ main, developer ]
  push:
    branches: [ main, developer ]
  workflow_dispatch:

# ============================================================
# permissions: O QUE este pipeline pode fazer
# ============================================================
# contents: read -> Pode ler o código do repositório
# pull-requests: write -> Pode comentar e atualizar status nos PRs
# ============================================================

permissions:
  contents: read
  pull-requests: write

# ============================================================
# jobs: TAREFAS que serão executadas
# ============================================================

jobs:
  # ==========================================================
  # JOB: test
  # ==========================================================
  # Chama o workflow reutilizável que contém a lógica de testes.
  # Isso mantém este arquivo simples e organizado.
  # ==========================================================
  test:
    name: Test
    # Chama o workflow reutilizável com a lógica de testes
    uses: ./.github/workflows/_reusable-test.yml
  
  notify:
    name: Nitificacao do resultado da pipeline
    needs: [test]
    if: always() # Garante que rode mesmo se o job "test" falhar
    runs-on: ubuntu-latest
    steps:
      - name: Compose message
        id: msg
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "status=SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
          else
            echo "status=FALHA" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          fi

      - name: Show result
        run: |
          echo "Status: ${{ steps.msg.outputs.status }}"
          echo "Color: ${{ steps.msg.outputs.color }}"

      # Novo step: falha o job se o test nao passou
      - name: Fail if tests failed
        if: needs.test.result != 'success'
        run: |
          echo "O job de testes falhou (resultado: ${{ needs.test.result }})."
          echo "Marcando o job notify como falha para reforcar o bloqueio."
          exit 1
