name: CI

# Gatilhos: push na main e tags, PR para main, e execucao manual
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch: # Habilita o botao para rodar manualmente na aba Actions

# Permissoes minimas: apenas leitura do codigo
permissions:
  contents: read

jobs:
  # Job de testes: delega para o workflow reutilizavel
  test:
    name: Test
    uses: ./.github/workflows/_reusable-test.yml

  # Job de notificacao: reporta o resultado da pipeline
  notify:
    name: Notify pipeline result
    needs: [test]
   if: always() # Roda mesmo se o job "test" falhar
    runs-on: ubuntu-latest
    steps:
      # Monta a mensagem com status e cor conforme o resultado
      - name: Compose message
        id: msg
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "status=SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
          else
            echo "status=FALHA" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"
          fi
