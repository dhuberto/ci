# ============================================================================
# CI PIPELINE - GitHub Actions
# ============================================================================


name: CI Pipeline

# ============================================================================
# BLOCO on: Define QUANDO este workflow será executado
# ============================================================================

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

# ============================================================================
# BLOCO permissions: Define o que este workflow pode fazer
# ============================================================================


permissions:
  contents: read
  pull-requests: write

# ============================================================================
# BLOCO jobs: Define as tarefas que serão executadas
# ============================================================================

jobs:

  # ==========================================================================
  # JOB: test
  # ==========================================================================
  

  test:
    name: Test
    uses: ./.github/workflows/_reusable-test.yml
    with:
      # Lista de versões do Python que serão testadas
      # O workflow reutilizável vai rodar os testes para cada versão
      python-version: '["3.10", "3.11"]'

# ============================================================================
# FIM DO PIPELINE
# ============================================================================
