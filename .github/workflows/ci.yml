# ============================================================
# CI PIPELINE - GitHub Actions
# ============================================================
# Pipeline principal de Integracao Continua.
# Executa testes e verifica seguranca em todo PR/push na main.
# ============================================================

name: CI Pipeline

# ============================================================
# on: QUANDO este pipeline sera executado
# ============================================================
# pull_request: Ao abrir/atualizar um PR para a branch main
# push: Ao fazer um push diretamente na branch main
# workflow_dispatch: Permite execucao manual pela aba Actions
# ============================================================

on:
  pull_request:
    branches: [ main, developer ]
  push:
    branches: [ main, developer ]
  workflow_dispatch:

# ============================================================
# permissions: O QUE este pipeline pode fazer
# ============================================================
# contents: read -> Pode ler o codigo do repositorio
# pull-requests: write -> Pode comentar e atualizar status nos PRs
# security-events: write -> Pode publicar resultados de seguranca
# ============================================================

permissions:
  contents: read
  pull-requests: write
  security-events: write

# ============================================================
# jobs: TAREFAS que serao executadas
# ============================================================

jobs:
  # ==========================================================
  # JOB: test
  # ==========================================================
  # Chama o workflow reutilizavel que contem a logica de testes.
  # Isso mantem este arquivo simples e organizado.
  # ==========================================================
  test:
    name: Test
    uses: ./.github/workflows/_reusable-test.yml

  # ==========================================================
  # JOB: security-scan
  # ==========================================================
  # Executa safety e pip-audit para detectar vulnerabilidades.
  # Extrai o motivo da falha (pacote + CVE) para o notify.
  # ==========================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    outputs:
      scan-reason: ${{ steps.reason.outputs.text }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Run safety scan
        id: safety
        continue-on-error: true
        run: |
          safety check -r requirements.txt --output text > safety-report.txt 2>&1 || true
          echo "--- Safety report ---"
          cat safety-report.txt

      - name: Run pip-audit
        id: audit
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt > audit-report.txt 2>&1 || true
          echo "--- pip-audit report ---"
          cat audit-report.txt

      - name: Extract failure reason
        id: reason
        if: always()
        run: |
          REASON=""

          # Extrai linhas com CVE ou vulnerabilidade do safety
          if [ -f safety-report.txt ]; then
            SAFETY_LINES=$(grep -iE "CVE-|vulnerab" safety-report.txt | head -3 | tr '\n' ' | ' | sed 's/ | $//')
            if [ -n "$SAFETY_LINES" ]; then
              REASON="Security scan: ${SAFETY_LINES}"
            fi
          fi

          # Extrai linhas com CVE ou GHSA do pip-audit
          if [ -f audit-report.txt ]; then
            AUDIT_LINES=$(grep -iE "CVE-|GHSA-|vulnerab" audit-report.txt | head -3 | tr '\n' ' | ' | sed 's/ | $//')
            if [ -n "$AUDIT_LINES" ]; then
              if [ -n "$REASON" ]; then
                REASON="${REASON} ; pip-audit: ${AUDIT_LINES}"
              else
                REASON="pip-audit: ${AUDIT_LINES}"
              fi
            fi
          fi

          # Fallback se nada foi extraido
          if [ -z "$REASON" ]; then
            REASON="Security scan falhou (motivo nao extraido dos relatorios)."
          fi

          {
            echo "text<<EOF"
            echo "$REASON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if vulnerabilities found
        if: steps.safety.outcome == 'failure' || steps.audit.outcome == 'failure'
        run: |
          echo "Vulnerabilidades encontradas. Veja o motivo acima."
          exit 1

  # ==========================================================
  # JOB: notify
  # ==========================================================
  # Notifica o resultado da pipeline. Mostra o motivo da falha
  # (testes ou seguranca) de forma legivel e sucinta.
  # Fica vermelho quando qualquer gate falha.
  # ==========================================================
  notify:
    name: Notificacao resultado da pipeline
    needs: [test, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compose message
        id: msg
        run: |
          TEST_RESULT="${{ needs.test.result }}"
          SEC_RESULT="${{ needs.security-scan.result }}"
          SEC_REASON="${{ needs.security-scan.outputs.scan-reason }}"

          if [ "$TEST_RESULT" = "success" ] && [ "$SEC_RESULT" = "success" ]; then
            echo "status=SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993" >> "$GITHUB_OUTPUT"
            echo "reason=Todos os gates passaram." >> "$GITHUB_OUTPUT"
          else
            echo "status=FALHA" >> "$GITHUB_OUTPUT"
            echo "color=15158332" >> "$GITHUB_OUTPUT"

            REASON=""
            if [ "$TEST_RESULT" != "success" ]; then
              REASON="Testes falharam (resultado: $TEST_RESULT)."
            fi
            if [ "$SEC_RESULT" != "success" ]; then
              if [ -n "$REASON" ]; then
                REASON="${REASON} ${SEC_REASON}"
              else
                REASON="${SEC_REASON}"
              fi
            fi

            {
              echo "reason<<EOF"
              echo "$REASON"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Show result
        run: |
          echo "Status: ${{ steps.msg.outputs.status }}"
          echo "Color: ${{ steps.msg.outputs.color }}"
          echo "Motivo: ${{ steps.msg.outputs.reason }}"

      - name: Fail if any gate failed
        if: needs.test.result != 'success' || needs.security-scan.result != 'success'
        run: |
          echo "Um dos gates falhou."
          echo "Motivo: ${{ steps.msg.outputs.reason }}"
          exit 1
